name: CI

# Every pull request into main or a release/** branch, and every push to them, goes through format, lint and
# tests. Only a push to main (a release/x.y.z merge) also builds a signed debug APK and publishes it as a
# pre-release tagged vX.Y.Z, where X.Y.Z comes from the VERSION file.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

# A new run cancels the previous one on pull requests; on branches it never does, so a publication is not cut.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept the Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses | tail -n 3

      - uses: gradle/actions/setup-gradle@v4

      - name: Check format, build, lint and test
        run: >
          ./gradlew
          spotlessCheck
          assembleDebug
          :app:compileReleaseKotlin
          compileDebugAndroidTestKotlin
          lintDebug
          testDebugUnitTest
          :domain:test
          :core:testing:test
          --stacktrace

      - name: Upload reports if something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

  release:
    name: Publish APK
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Read the version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Fail if this version is already published
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Bump the VERSION file (new release/x.y.z branch) before merging into main."
            exit 1
          fi

      - name: Accept the Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses | tail -n 3

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TAVOLA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tavola-debug.keystore"
          echo "TAVOLA_KEYSTORE_PATH=$RUNNER_TEMP/tavola-debug.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          TAVOLA_KEYSTORE_PASSWORD: ${{ secrets.TAVOLA_KEYSTORE_PASSWORD }}
          TAVOLA_KEY_ALIAS: ${{ secrets.TAVOLA_KEY_ALIAS }}
        run: >
          ./gradlew :app:assembleDebug
          -Ptavola.versionCode=${RUN_NUMBER}
          -Ptavola.versionName=${VERSION}

      - name: Publish the pre-release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          APK="tavola-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            printf '%s\n\n' "$COMMIT_MESSAGE"
            printf 'Commit: %s\nVersion: %s (debug, build %s)\n' "$GITHUB_SHA" "$VERSION" "$RUN_NUMBER"
          } > notes.md
          gh release create "v${VERSION}" "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Tavola ${VERSION}" \
            --notes-file notes.md
