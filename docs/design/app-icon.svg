<!-- Master artwork of the launcher icon (108x108 adaptive grid, safe zone r=33). app/src/main/res/drawable/ic_launcher_*.xml are hand-converted from it: keep them in sync. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" fill="#D4813A"/>
  <g transform="translate(52 56) rotate(40) scale(1.06)">
