name: CI

# Cada push a main (y cada pull request) pasa formato, lint y tests. Si es un push a main y todo va bien,
# se compila un APK de debug firmado y se publica como pre-release, lista para instalar desde el móvil.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# En pull requests una ejecución nueva cancela la anterior; en main nunca, para no cortar una publicación.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Formato, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Aceptar las licencias del SDK de Android
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses | tail -n 3

      - uses: gradle/actions/setup-gradle@v4

      - name: Comprobar formato, compilar, lint y tests
        run: >
          ./gradlew
          spotlessCheck
          assembleDebug
          :app:compileReleaseKotlin
          compileDebugAndroidTestKotlin
          lintDebug
          testDebugUnitTest
          :domain:test
          :core:testing:test
          --stacktrace

      - name: Subir informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-fallo
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

  release:
    name: Publicar APK
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Aceptar las licencias del SDK de Android
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses | tail -n 3

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.TAVOLA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tavola-debug.keystore"
          echo "TAVOLA_KEYSTORE_PATH=$RUNNER_TEMP/tavola-debug.keystore" >> "$GITHUB_ENV"

      - name: Compilar el APK
        env:
          TAVOLA_KEYSTORE_PASSWORD: ${{ secrets.TAVOLA_KEYSTORE_PASSWORD }}
          TAVOLA_KEY_ALIAS: ${{ secrets.TAVOLA_KEY_ALIAS }}
        run: >
          ./gradlew :app:assembleDebug
          -Ptavola.versionCode=${RUN_NUMBER}
          -Ptavola.versionName=0.1.${RUN_NUMBER}

      - name: Publicar la pre-release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          APK="tavola-0.1.${RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            printf '%s\n\n' "$COMMIT_MESSAGE"
            printf 'Commit: %s\nVersión: 0.1.%s (debug)\n' "$GITHUB_SHA" "$RUN_NUMBER"
          } > notes.md
          gh release create "build-${RUN_NUMBER}" "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Build ${RUN_NUMBER}" \
            --notes-file notes.md

      - name: Conservar solo las 10 últimas builds
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
